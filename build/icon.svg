      <stop offset="0" stop-color="#e0805f"/>
      <stop offset="1" stop-color="#cf6c4c"/>
    </linearGradient>
  </defs>
  <rect x="48" y="48" width="928" height="928" rx="208" fill="url(#bg)"/>
